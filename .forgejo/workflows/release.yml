name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.mcintire.me
  OWNER: graham
  IMAGE_NAME: towerops-agent
  DOCKER_CLI_VERSION: '28.5.2'
  BUILDX_VERSION: '0.35.0'

concurrency:
  # Do not cancel: a half-pushed release tag is worse than a redundant build.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 -timeout 60s ./...

  release:
    name: Build and push image
    runs-on: ubuntu-latest
    # Tests used to run *after* the image was already pushed, which made them
    # decorative on a release.
    needs: [test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Docker CLI and buildx
        # The runner automounts the host Docker socket, so we only need the
        # client. No Kaniko, no build action.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          # Docker 23+ routes `docker build` through buildx. The static tarball
          # ships only the CLI, so the plugin has to be installed separately or
          # DOCKER_BUILDKIT=1 fails with "buildx component is missing".
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$HOME/.docker/cli-plugins/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker version
          docker buildx version

      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"

          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$OWNER" --password-stdin

          # VERSION reaches `-X main.version` in the Dockerfile. It previously
          # travelled via an `extra_args` input the Kaniko action never
          # declared, so it was silently dropped and every published image
          # reported version "dev".
          #
          # Real BuildKit also means the `RUN --mount=type=cache` lines for the
          # Go module and build caches actually take effect.
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

          {
            echo "### Agent ${VERSION} released"
            echo ""
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          docker image rm "${IMAGE}:${GITHUB_REF_NAME#v}" "${IMAGE}:latest" 2>/dev/null || true
          docker logout "$REGISTRY" || true
