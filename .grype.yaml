# Grype configuration. Picked up automatically by anchore/scan-action, which
# only disables auto-detection if its `config` input is set.
#
# The CI gate fails the build at high severity or above; see .github/workflows/ci.yml.

ignore:
  # CVE-2026-97399 (GLIBC-SA-2026-0024): one-byte overread in the
  # Power8-optimized strncasecmp implementation. The upstream CVE record
  # limits affected platforms to Power8 and marks all others unaffected:
  # https://github.com/CVEProject/cvelistV5/blob/main/cves/2026/97xxx/CVE-2026-97399.json
  # CI publishes only linux/amd64 and linux/arm64, neither of which contains
  # that implementation. Wolfi currently ships 2.44-r7; there is no package
  # upgrade needed for these architectures. Remove this exception before
  # adding a Power8/ppc64le build, or when Wolfi ships a patched package.
  - vulnerability: CVE-2026-97399
    reason: Power8-only code is absent from the published amd64 and arm64 images.
    package:
      name: glibc-2.44
      type: apk

  # GO-2026-5932: "golang.org/x/crypto/openpgp is unmaintained, unsafe by
  # design, and has known security issues."
  #
  # This is the one entry here, and it is not a deferral - there is nothing to
  # upgrade to. The advisory has an `introduced: 0` range and no `fixed` event,
  # so it matches every version of golang.org/x/crypto that has ever been
  # published. Grype flags it on the module version alone.
  #
  # The advisory applies only to code importing golang.org/x/crypto/openpgp.
  # We do not:
  #
  #   $ go list -deps ./... | grep openpgp    # no matches
  #   $ govulncheck ./...                     # not called
  #
  # We depend on x/crypto for SSH and for the chacha20poly1305 and cryptobyte
  # packages pulled in transitively. If a future change ever does import
  # openpgp, delete this entry rather than widening it - the package really is
  # unsafe, and this rule exists because we are not using it.
  - vulnerability: GO-2026-5932
    package:
      name: golang.org/x/crypto
      type: go-module

  # CVE-2026-89092: stack overflow in glibc's nscd daemon when a malicious
  # DNS server returns an oversized response. Chainguard's advisory marks
  # the Wolfi glibc-2.44 package "Pending upstream fix" — there is no fixed
  # version to upgrade to, and `apk upgrade` in the Dockerfile picks it up
  # automatically once one lands.
  #
  # The vulnerable code path is unreachable in this image: nscd is not
  # installed or run, and the agent binary is built CGO_ENABLED=0, so name
  # resolution goes through Go's own resolver and never touches glibc's NSS.
  # Delete this entry when a fixed glibc ships in wolfi-base.
  - vulnerability: CVE-2026-89092
    package:
      name: glibc-2.44
      type: apk

  # All five CVEs below are unfixed upstream: the newest glibc-2.44 Wolfi
  # publishes is 2.44-r7 (already installed by the Dockerfile's
  # `apk upgrade`), and packages.wolfi.dev/os/security.json lists secfixes
  # only through r6. The fixes land in glibc 2.45. Each entry has its own
  # reachability case - do not widen or merge them. Delete each when a
  # fixed glibc ships in wolfi-base.

  # CVE-2026-86805 (GLIBC-SA-2026-0022): TOCTOU in ld.so when expanding
  # $ORIGIN in DT_RPATH of an AT_SECURE (setuid/setgid or file-capability)
  # program. Two preconditions fail in this image: there is no setuid/setgid
  # binary at all (the Dockerfile rm's linux-pam's unix_chkpwd, the only one
  # installed), and the sole file-capability binary, /usr/bin/ping, has no
  # DT_RPATH/DT_RUNPATH - verified `readelf -d` — so $ORIGIN is never
  # expanded under AT_SECURE.
  - vulnerability: CVE-2026-86805
    package:
      name: glibc-2.44
      type: apk

  # CVE-2026-95818 (GLIBC-SA-2026-0023): stack buffer overflow in ld.so when
  # an AT_SECURE program's DT_RPATH/DT_RUNPATH begins with $ORIGIN followed
  # by NUL or '/'. Same reachability answer as CVE-2026-86805 above: no
  # setuid/setgid binaries in the image and ping, the only file-capability
  # binary, carries no RPATH/RUNPATH.
  - vulnerability: CVE-2026-95818
    package:
      name: glibc-2.44
      type: apk

  # CVE-2026-8674 (GLIBC-SA-2026-0021): assertion failure aborting the
  # process when glibc's DNS stub resolver initializes from a resolv.conf
  # search list, or a LOCALDOMAIN variable, containing a ~200+ character
  # domain. Neither input is attacker-reachable here: resolv.conf is
  # container-managed, the agent sets no LOCALDOMAIN for its exec'd
  # children, and the only glibc-linked child (ping) receives an IP literal
  # that never reaches the resolver anyway. The agent itself is
  # CGO_ENABLED=0 and uses Go's own resolver.
  - vulnerability: CVE-2026-8674
    package:
      name: glibc-2.44
      type: apk

  # CVE-2026-77117: hang in glibc's iconv SHIFT_JISX0213 -> UCS-4 converter.
  # The image ships no gconv modules at all (/usr/lib/gconv is absent), no
  # iconv binary, and no localedef; nothing in it can instantiate the
  # converter. The agent binary is CGO_ENABLED=0.
  - vulnerability: CVE-2026-77117
    package:
      name: glibc-2.44
      type: apk

  # CVE-2026-80489: hang in glibc's iconv EUC-JISX0213 -> UCS-4 converter.
  # Same reachability answer as CVE-2026-77117: no gconv modules ship in the
  # image, so the converter code is not present to be reached.
  - vulnerability: CVE-2026-80489
    package:
      name: glibc-2.44
      type: apk
