# Minimal agent deployment. The Agents page in Towerops generates this file
# with your API URL and token filled in, plus a Watchtower service that keeps
# the image up to date.
services:
  towerops-agent:
    image: ghcr.io/towerops-app/towerops-agent:latest
    pull_policy: always
    container_name: towerops-agent
    restart: unless-stopped

    volumes:
      # Persists TOWEROPS_HOST_KEYS_FILE (/data/known_hosts.json) across recreates.
      - towerops-agent-data:/data

    # Docker includes NET_RAW by default and the image binary carries
    # cap_net_raw+ep. This is only needed under runtimes that drop NET_RAW,
    # such as Kubernetes restricted PSS or some hardened Docker daemons.
    cap_add:
      - NET_RAW

    environment:
      # Required: Towerops base URL
      - TOWEROPS_API_URL=https://towerops.net

      # Required: agent authentication token
      # Get this from: Organization > Agents > Create New Agent
      - TOWEROPS_AGENT_TOKEN=your-agent-token-here

      # Optional: error, warn, info, debug (default: info)
      - TOWEROPS_LOG_LEVEL=info

      # Optional: text or json (default: text)
      - TOWEROPS_LOG_FORMAT=text

      # Optional: permit plaintext ws:// connections (default: false)
      - TOWEROPS_INSECURE=false

      # Writable trust-on-first-use store, persisted by the volume above
      - TOWEROPS_HOST_KEYS_FILE=/data/known_hosts.json

      # Optional: receive SNMP traps on UDP 162 and forward them to Towerops
      - TOWEROPS_TRAP_ENABLED=false

      # Optional: local trap bind address (default: 0.0.0.0; use :: for IPv6)
      - TOWEROPS_TRAP_BIND=0.0.0.0

      # Optional: trap listener UDP port (default: 162)
      - TOWEROPS_TRAP_PORT=162

      # Optional: only accept traps carrying this community string
      # Default: unset, which accepts any community
      # - TOWEROPS_TRAP_COMMUNITY=public

    # Only needed when TOWEROPS_TRAP_ENABLED=true.
    ports:
      - "162:162/udp"

volumes:
  towerops-agent-data:
